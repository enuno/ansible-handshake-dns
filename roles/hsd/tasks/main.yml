---
- name: Create HSD data directory
  ansible.builtin.file:
    path: "{{ hsd_data_dir }}"
    state: directory
    mode: '0755'
  tags: [install, configure]

- name: Deploy HSD configuration
  ansible.builtin.template:
    src: hip5.json.j2
    dest: "{{ hsd_data_dir }}/hip5.json"
    mode: '0644'
  tags: [configure]
  notify: Restart hsd

- name: Deploy hsd container
  community.docker.docker_container:
    name: hsd
    image: "{{ hsd_image }}"
    command: --rs-host 0.0.0.0 --rs-port 53 --hip5 --plugins hip5
    networks:
      - name: "{{ docker_network }}"
    volumes:
      - "{{ hsd_data_dir }}:/root/.hsd"
    restart_policy: unless-stopped
    state: started
    healthcheck:
      test: ["CMD-SHELL", "hsd-cli info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      com.dns.service: "handshake"
      com.dns.role: "blockchain"
  tags: [deploy]
