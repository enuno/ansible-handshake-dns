# Handshake (HSD) Docker image version
# Version 8.0.0 requires database migrations on first run:
#   --chain-migrate=4 --wallet-migrate=7
# IMPORTANT: Backup wallet before upgrading to v8.0.0
hsd_image: ghcr.io/handshake-org/hsd:v8.0.0
hsd_data_dir: /opt/hsd/data
hsd_hip5_config_path: /root/.hsd/hip5.json
